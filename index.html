<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | AdminExpress</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="pagina">

    <aside class="lado-azul">
      <p class="marca">AdminExpress</p>
    </aside>

    <main class="lado-form">
      <form class="formulario" action="#" method="post">
        <h1 class="saludo">Let's <b>Sign In</b></h1>
        <p class="indicacion">Hey, Enter your details to get sign in to your account.</p>
 
        <div class="bloque">
          <label class="etiqueta" for="email">Email</label>
          <div class="caja">
            <input id="email" name="email" type="email" placeholder="Enter Email" autocomplete="email" required>
          </div>
        </div>

        <div class="bloque">
          <label class="etiqueta" for="password">Password</label>
          <div class="caja">
            <input id="password" name="password" type="password" placeholder="Enter Password" autocomplete="current-password" required>
          </div>
        </div>

        <a class="olvido" href="#">Forgot password?</a>

        <button class="boton-entrar" type="submit">Sign In</button>

        <p class="registro">Don't have an account? <a href="#">Sign Up</a></p>
      </form>
    </main>

  </div>
</body>
</html>
